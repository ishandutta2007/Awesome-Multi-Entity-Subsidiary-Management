<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: rgba(255,255,255,0.04); stroke-width: 1; }
    .pulse-circle { animation: pulse 4s ease-in-out infinite alternate; }
    .orbit-pulse { animation: orbitGlow 6s linear infinite; }
    .float-slow { animation: float 7s ease-in-out infinite alternate; }
    .flow-line { stroke-dasharray: 6 6; animation: dash 25s linear infinite; }
    .flow-line-rev { stroke-dasharray: 6 6; animation: dashRev 20s linear infinite; }

    @keyframes dash {
      to { stroke-dashoffset: -300; }
    }
    @keyframes dashRev {
      to { stroke-dashoffset: 300; }
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.25; }
      100% { transform: scale(1.15); opacity: 0.55; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Multi-Entity Network Background Visualization -->
  <!-- Ambient Glow Orbs -->
  <circle cx="1020" cy="180" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-circle" />
  <circle cx="180" cy="80" r="110" fill="#0ea5e9" opacity="0.12" filter="url(#glow)" class="pulse-circle" />
  <circle cx="950" cy="270" r="90" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="pulse-circle" />

  <!-- Subsidiary / Entity Network Nodes (Right Side Graphic) -->
  <g class="float-slow" opacity="0.85">
    <!-- Connecting flow lines -->
    <path d="M 1000 170 L 880 100" stroke="#38bdf8" stroke-width="1.5" class="flow-line" opacity="0.6" />
    <path d="M 1000 170 L 890 250" stroke="#818cf8" stroke-width="1.5" class="flow-line-rev" opacity="0.6" />
    <path d="M 1000 170 L 1110 110" stroke="#a855f7" stroke-width="1.5" class="flow-line" opacity="0.6" />
    <path d="M 1000 170 L 1120 240" stroke="#38bdf8" stroke-width="1.5" class="flow-line-rev" opacity="0.6" />
    <path d="M 880 100 L 890 250" stroke="#475569" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
    <path d="M 1110 110 L 1120 240" stroke="#475569" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

    <!-- Subsidiary Nodes -->
    <!-- Parent HQ Node -->
    <g transform="translate(1000, 170)">
      <circle r="36" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#nodeGlow)" />
      <circle r="28" fill="url(#primaryGrad)" opacity="0.3" />
      <text y="5" fill="#f8fafc" text-anchor="middle" font-size="14" font-weight="700" font-family="-apple-system, sans-serif">HOLDCO</text>
    </g>

    <!-- Entity A (Europe) -->
    <g transform="translate(880, 100)">
      <circle r="26" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#nodeGlow)" />
      <circle r="20" fill="#6366f1" opacity="0.25" />
      <text y="4" fill="#e2e8f0" text-anchor="middle" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">SUB-EU</text>
    </g>

    <!-- Entity B (Americas) -->
    <g transform="translate(890, 250)">
      <circle r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#nodeGlow)" />
      <circle r="20" fill="#0ea5e9" opacity="0.25" />
      <text y="4" fill="#e2e8f0" text-anchor="middle" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">SUB-US</text>
    </g>

    <!-- Entity C (APAC) -->
    <g transform="translate(1110, 110)">
      <circle r="25" fill="#1e293b" stroke="#c084fc" stroke-width="2" filter="url(#nodeGlow)" />
      <circle r="19" fill="#a855f7" opacity="0.25" />
      <text y="4" fill="#e2e8f0" text-anchor="middle" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">SUB-AP</text>
    </g>

    <!-- Elimination Entity -->
    <g transform="translate(1120, 240)">
      <circle r="25" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#nodeGlow)" />
      <circle r="19" fill="#10b981" opacity="0.25" />
      <text y="4" fill="#e2e8f0" text-anchor="middle" font-size="10" font-weight="600" font-family="-apple-system, sans-serif">ELIM-CO</text>
    </g>
  </g>

  <!-- Foreground Title and Content (Clear & High Contrast) -->
  <g transform="translate(70, 75)">
    <!-- Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" />
      <text x="32" y="18" fill="#38bdf8" class="badge-text">CURATED ENTERPRISE &amp; OSS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" fill="#ffffff" font-size="44" class="title-text">
      Awesome Multi-Entity &amp;
    </text>
    <text x="0" y="125" fill="url(#primaryGrad)" font-size="44" class="title-text">
      Subsidiary Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" fill="#94a3b8" font-size="16" class="sub-text">
      Enterprise ERP &amp; Open-Source Platforms for Multi-Company Accounting,
    </text>
    <text x="0" y="194" fill="#94a3b8" font-size="16" class="sub-text">
      Intercompany Elimination, Multi-Currency Consolidation &amp; Financial Governance.
    </text>

    <!-- Metrics / Feature Badges -->
    <g transform="translate(0, 222)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="65" y="18" fill="#e2e8f0" text-anchor="middle" font-size="12" font-family="-apple-system, sans-serif">🏛️ Multi-Entity</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(140, 0)">
        <rect width="145" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72" y="18" fill="#e2e8f0" text-anchor="middle" font-size="12" font-family="-apple-system, sans-serif">🔄 Intercompany</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(295, 0)">
        <rect width="135" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="67" y="18" fill="#e2e8f0" text-anchor="middle" font-size="12" font-family="-apple-system, sans-serif">🌐 Multi-Currency</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(440, 0)">
        <rect width="145" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72" y="18" fill="#e2e8f0" text-anchor="middle" font-size="12" font-family="-apple-system, sans-serif">📊 Consolidation</text>
      </g>
    </g>
  </g>
</svg>